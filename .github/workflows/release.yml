name: Create Release

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  get-admins:
    if: github.event.head_commit.message == 'do-production-release'
    runs-on: ubuntu-latest
    outputs:
      admins: ${{ steps.admins.outputs.admins }}
    steps:
      - name: Set up Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Get Admins
        id: admins
        run: |
          admins="|$(tr '\n' '|' < .github/admins.txt)"
          echo "admins=$admins" >> "$GITHUB_OUTPUT"
          echo "Admins: $admins"

  create-release:
    needs: get-admins
    if: github.event.head_commit.message == 'do-production-release' && contains(needs.get-admins.outputs.admins, format('|{0}|', github.event.head_commit.author.username))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set up Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Keep the write token off disk; it is passed only to the steps that need it
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      # Locked dependency tree (integrity-checked) with lifecycle scripts disabled
      - name: Install Release Tooling
        run: npm ci --ignore-scripts --prefix .github/release

      # semantic-release verifies push access even in --dry-run, so it needs the token
      - name: Run Semantic Release (dry run)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck disable=SC2016 # ${version} is a semantic-release placeholder, not a shell var
          .github/release/node_modules/.bin/semantic-release \
            --repository-url "https://github.com/$GITHUB_REPOSITORY" \
            --branches master \
            --tagFormat '${version}' \
            --plugins "@semantic-release/commit-analyzer" "@semantic-release/release-notes-generator" \
            --no-ci --dry-run > temp.txt
          cat temp.txt

      - name: Compute Versions
        id: version
        run: |
          last_version=$(git describe --tags --abbrev=0 --match '[0-9]*' 2>/dev/null || true)
          next_version=$(grep -oP 'The next release version is \K\S+' temp.txt || true)
          echo "Last Version: $last_version"
          echo "Next Version: $next_version"

          if [ -z "$next_version" ] || [ "$next_version" = "$last_version" ]; then
            echo "::notice::No releasable commits since $last_version; skipping release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          major_version="v${next_version%%.*}"
          major_version_exists=false
          if git rev-parse "$major_version" >/dev/null 2>&1; then
            major_version_exists=true
          fi
          echo "Major Version: $major_version (exists: $major_version_exists)"

          {
            echo "skip=false"
            echo "next_version=$next_version"
            echo "major_version=$major_version"
            echo "major_version_exists=$major_version_exists"
          } >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        if: steps.version.outputs.skip != 'true'
        run: |
          release_notes=$(sed '/^##/,$!d' temp.txt | awk '{$1=$1};1' | sed 's/))/)/g' | sed 's/ (h/](h/g' | sed 's/^## /## [/' | sed 's/) (/)(/g' | sed 's/ (/ [/g' | sed 's/)(/) (/g' | sed 's/\w/\u&/')
          printf '%s\n' "$release_notes" > RELEASE_NOTES.md

      - name: Create Release
        if: steps.version.outputs.skip != 'true'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: ${{ steps.version.outputs.next_version }}
          tag: ${{ steps.version.outputs.next_version }}
          commit: master
          bodyFile: RELEASE_NOTES.md
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Major Version Release if it doesn't exist
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.major_version_exists == 'false'
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          name: ${{ steps.version.outputs.major_version }}
          tag: ${{ steps.version.outputs.major_version }}
          commit: master
          prerelease: false
          draft: false
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Major Version Release if it exists
        if: steps.version.outputs.skip != 'true' && steps.version.outputs.major_version_exists == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAJOR_VERSION: ${{ steps.version.outputs.major_version }}
          NEXT_VERSION: ${{ steps.version.outputs.next_version }}
        run: |
          git config user.name "Github Actions"
          git config user.email noreply@github.com
          git tag -fa "$MAJOR_VERSION" -m "chore: point $MAJOR_VERSION to $NEXT_VERSION"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/$MAJOR_VERSION" --force
